<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#18324a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #5b6f82; }
      .screen-title { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .h1 { font: 700 34px Arial, sans-serif; fill: #17324d; }
      .h2 { font: 700 25px Arial, sans-serif; fill: #17324d; }
      .body { font: 400 22px Arial, sans-serif; fill: #31475b; }
      .small { font: 400 18px Arial, sans-serif; fill: #607488; }
      .button { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .button-dark { font: 700 22px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 19px Arial, sans-serif; fill: #476177; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f3f7fa"/>
  <text x="900" y="66" text-anchor="middle" class="title">Protótipos das principais interfaces</text>
  <text x="900" y="104" text-anchor="middle" class="subtitle">Wireframes de documentação do fluxo acessível do Lembrete Amigo</text>

  <!-- Tela 1 -->
  <g transform="translate(105,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="820" rx="48" fill="#ffffff" stroke="#b9c9d6" stroke-width="5"/>
    <rect x="170" y="18" width="140" height="14" rx="7" fill="#c8d4de"/>
    <rect x="0" y="54" width="480" height="84" fill="#e7f4ef"/>
    <text x="34" y="108" class="screen-title">Lembrete Amigo</text>
    <circle cx="425" cy="96" r="25" fill="#2f8f6b"/>
    <text x="425" y="104" text-anchor="middle" class="button">?</text>

    <text x="34" y="190" class="h1">Bom dia, João!</text>
    <text x="34" y="226" class="body">Seu próximo lembrete:</text>
    <rect x="30" y="258" width="420" height="155" rx="25" fill="#fff7dc" stroke="#edc85b" stroke-width="3"/>
    <text x="58" y="302" class="label">10:00 • MEDICAÇÃO</text>
    <text x="58" y="350" class="h2">Tomar o remédio</text>
    <text x="58" y="386" class="body">Faltam 25 minutos</text>

    <circle cx="240" cy="548" r="103" fill="#2f8f6b"/>
    <path d="M226 502 h28 a18 18 0 0 1 18 18 v54 a18 18 0 0 1 -18 18 h-28 a18 18 0 0 1 -18 -18 v-54 a18 18 0 0 1 18 -18z" fill="#ffffff"/>
    <path d="M191 553 v18 a49 49 0 0 0 98 0 v-18 M240 620 v27 M207 647 h66" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <text x="240" y="694" text-anchor="middle" class="h2">TOQUE PARA FALAR</text>

    <rect x="30" y="738" width="200" height="58" rx="20" fill="#e8eef3"/>
    <rect x="250" y="738" width="200" height="58" rx="20" fill="#e8eef3"/>
    <text x="130" y="775" text-anchor="middle" class="button-dark">Meus lembretes</text>
    <text x="350" y="775" text-anchor="middle" class="button-dark">Pedir ajuda</text>
  </g>

  <!-- Tela 2 -->
  <g transform="translate(660,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="820" rx="48" fill="#ffffff" stroke="#b9c9d6" stroke-width="5"/>
    <rect x="170" y="18" width="140" height="14" rx="7" fill="#c8d4de"/>
    <rect x="0" y="54" width="480" height="84" fill="#fff0ec"/>
    <text x="34" y="108" class="screen-title">Lembrete ativo</text>
    <circle cx="424" cy="96" r="25" fill="#d55b3e"/>
    <path d="M414 83 v26 M434 83 v26" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <circle cx="240" cy="235" r="76" fill="#eaf2f8" stroke="#8baac2" stroke-width="3"/>
    <rect x="216" y="183" width="48" height="104" rx="22" fill="#ffffff" stroke="#477a9f" stroke-width="5"/>
    <line x1="218" y1="235" x2="262" y2="235" stroke="#477a9f" stroke-width="5"/>
    <text x="240" y="350" text-anchor="middle" class="label">AGORA • 10:00</text>
    <text x="240" y="397" text-anchor="middle" class="h1">Tomar o remédio</text>
    <text x="240" y="435" text-anchor="middle" class="body">Dipirona • 1 comprimido</text>

    <rect x="42" y="476" width="396" height="76" rx="24" fill="#e7f4ef"/>
    <circle cx="86" cy="514" r="24" fill="#2f8f6b"/>
    <path d="M78 506 l0 16 l15 -8 z" fill="#ffffff"/>
    <text x="126" y="523" class="button-dark">OUVIR NOVAMENTE</text>

    <rect x="42" y="590" width="396" height="78" rx="24" fill="#2f8f6b"/>
    <text x="240" y="639" text-anchor="middle" class="button">CONFIRMAR</text>
    <rect x="42" y="687" width="190" height="68" rx="22" fill="#f3cf5b"/>
    <rect x="248" y="687" width="190" height="68" rx="22" fill="#e8eef3"/>
    <text x="137" y="730" text-anchor="middle" class="button-dark">ADIAR 10 MIN</text>
    <text x="343" y="730" text-anchor="middle" class="button-dark">PEDIR AJUDA</text>
  </g>

  <!-- Tela 3 -->
  <g transform="translate(1215,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="820" rx="48" fill="#ffffff" stroke="#b9c9d6" stroke-width="5"/>
    <rect x="170" y="18" width="140" height="14" rx="7" fill="#c8d4de"/>
    <rect x="0" y="54" width="480" height="84" fill="#eaf2f8"/>
    <text x="34" y="108" class="screen-title">Painel do cuidador</text>
    <circle cx="425" cy="96" r="25" fill="#477a9f"/>
    <circle cx="425" cy="90" r="8" fill="#ffffff"/>
    <path d="M410 111 a16 13 0 0 1 30 0" fill="#ffffff"/>

    <rect x="30" y="166" width="420" height="92" rx="22" fill="#f4f7fa"/>
    <circle cx="78" cy="212" r="28" fill="#c8dce9"/>
    <text x="121" y="205" class="h2">João Barbosa</text>
    <text x="121" y="235" class="small">Online há 2 minutos</text>
    <circle cx="416" cy="212" r="10" fill="#2f8f6b"/>

    <text x="30" y="306" class="h2">Resumo de hoje</text>
    <rect x="30" y="330" width="128" height="112" rx="20" fill="#e7f4ef"/>
    <rect x="176" y="330" width="128" height="112" rx="20" fill="#fff7dc"/>
    <rect x="322" y="330" width="128" height="112" rx="20" fill="#fff0ec"/>
    <text x="94" y="381" text-anchor="middle" class="h1">4</text>
    <text x="94" y="416" text-anchor="middle" class="small">Concluídos</text>
    <text x="240" y="381" text-anchor="middle" class="h1">2</text>
    <text x="240" y="416" text-anchor="middle" class="small">Pendentes</text>
    <text x="386" y="381" text-anchor="middle" class="h1">1</text>
    <text x="386" y="416" text-anchor="middle" class="small">Atrasado</text>

    <text x="30" y="491" class="h2">Atenção necessária</text>
    <rect x="30" y="514" width="420" height="100" rx="22" fill="#fff0ec" stroke="#e8a08d" stroke-width="2"/>
    <circle cx="75" cy="564" r="25" fill="#d55b3e"/>
    <text x="75" y="574" text-anchor="middle" class="button">!</text>
    <text x="116" y="553" class="button-dark">Medicação atrasada</text>
    <text x="116" y="584" class="small">Há 18 minutos • Toque para ligar</text>

    <rect x="30" y="649" width="420" height="68" rx="22" fill="#477a9f"/>
    <text x="240" y="692" text-anchor="middle" class="button">+ NOVO LEMBRETE</text>
    <rect x="30" y="738" width="128" height="58" rx="18" fill="#e8eef3"/>
    <rect x="176" y="738" width="128" height="58" rx="18" fill="#e8eef3"/>
    <rect x="322" y="738" width="128" height="58" rx="18" fill="#e8eef3"/>
    <text x="94" y="775" text-anchor="middle" class="small">Rotina</text>
    <text x="240" y="775" text-anchor="middle" class="small">Mensagens</text>
    <text x="386" y="775" text-anchor="middle" class="small">Relatórios</text>
  </g>
</svg>
